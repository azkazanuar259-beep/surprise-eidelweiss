
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #17152c, #56345f, #b66b83);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 15px;
    }

    p {
      line-height: 1.8;
      margin: 15px auto;
      max-width: 500px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 600px;
      margin: 30px auto;
    }

    .gallery img {
      width: 100%;
      border-radius: 15px;
      object-fit: cover;
    }

    button {
      padding: 13px 25px;
      border: none;
      border-radius: 30px;
      background: #ffb6c9;
      color: #382039;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>For My Eidelweiss ❤️</h1>

  <p>
    Ada banyak hal yang mungkin nggak selalu bisa
    aku ungkapkan lewat kata-kata.
    Tapi satu hal yang ingin aku pastikan,
    kamu adalah seseorang yang sangat berarti.
  </p>

  <div class="gallery">
    <!-- Foto-foto kita nanti ditambahkan di sini -->
  </div>

  <button onclick="alert('I Love You ❤️')">
    Klik Aku ❤️
  </button>

</body>
</html>
